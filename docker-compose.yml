version: '3.8'
services:
  deploypilot:
    image: ghcr.io/yogdunana/deploypilot:latest
    container_name: deploypilot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DEPLOYPILOT_DATABASE_TYPE=sqlite
      - DEPLOYPILOT_DATABASE_DSN=/app/data/deploypilot.db
      # SECURITY: JWT_SECRET must be set to a strong random value (min 16 chars).
      # Generate one with: openssl rand -base64 24
      - DEPLOYPILOT_AUTH_JWT_SECRET=${JWT_SECRET:?JWT_SECRET environment variable is required}
      - DEPLOYPILOT_SERVER_PORT=8080
      - DEPLOYPILOT_LOG_LEVEL=info
      - DEPLOYPILOT_LOG_FORMAT=json
    volumes:
      - deploypilot-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Redis (for Pub/Sub event bus, recommended for multi-instance deployments)
  redis:
    image: redis:7-alpine
    container_name: deploypilot-redis
    restart: unless-stopped
    # SECURITY: Redis port is NOT exposed to host.
    # Only accessible from within the Docker network.
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
    # SECURITY: Redis requires password authentication.
    # Set REDIS_PASSWORD environment variable before running docker-compose.
    command: >
      sh -c "redis-server --appendonly yes --requirepass $${REDIS_PASSWORD:?REDIS_PASSWORD environment variable is required}"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD environment variable is required}

volumes:
  deploypilot-data:
  redis-data:
