version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosec
    - govet
    - staticcheck
    - noctx
    - bodyclose
    - sqlclosecheck
  settings:
    errcheck:
      exclude-functions:
        - fmt.Sscanf
    gosec:
      excludes:
        - G101  # Hardcoded credentials (test files only, see exclusions)
        - G104  # Unhandled errors (acceptable in defer/close scenarios)
        - G115  # Integer overflow conversion (common in Go)
        - G304  # File path from variable (used in file manager)
        - G306  # WriteFile permissions
        - G404  # Weak random (non-security contexts)
  exclusions:
    rules:
      - linters: [errcheck]
        path: _test\.go
      - linters: [gosec]
        path: internal/provider/
      - linters: [gosec]
        path: internal/agent/
      - linters: [gosec]
        path: internal/engine/builder/
      - linters: [gosec]
        path: internal/backup/
      - linters: [gosec]
        path: cmd/
      - linters: [gosec]
        path: _test\.go
      - linters: [noctx]
        path: _test\.go
      - linters: [bodyclose]
        path: _test\.go
