version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosec
    - govet
    - staticcheck
    - noctx
    - bodyclose
    - sqlclosecheck
  settings:
    errcheck:
      exclude-functions:
        - fmt.Sscanf
    gosec:
      excludes:
        - G101  # hardcoded credentials false positive
        - G404  # weak random in non-crypto contexts
  exclusions:
    rules:
      - linters:
          - errcheck
        path: _test\.go
