          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request or invalid role_id
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: forbidden
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update user role
      tags:
      - Users
  /users/me:
    get:
      description: Retrieve the currently authenticated user's profile information
      produces:
      - application/json
      responses:
        "200":
          description: status, data (User with Role and Tenant)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: not authenticated
          schema:
            additionalProperties: true
            type: object
        "404":
          description: user not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: JWT token with "Bearer " prefix
    in: header
    name: Authorization
    type: apiKey
