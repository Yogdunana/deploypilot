basePath: /api/v1
host: localhost:8080
info:
  contact:
    name: DeployPilot
    url: https://github.com/Yogdunana/deploypilot
  description: AI-native deployment platform REST API
  license:
    name: MIT
    url: https://github.com/Yogdunana/deploypilot/blob/main/LICENSE
  termsOfService: http://swagger.io/terms/
  title: DeployPilot API
  version: "1.0"
paths:
  /apps:
    get:
      description: Retrieve a list of all registered applications
      produces:
      - application/json
      responses:
        "200":
          description: status, data (array of App)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List all applications
      tags:
      - Apps
    post:
      consumes:
      - application/json
      description: Create a new application configuration with the provided details
      parameters:
      - description: Application creation request
        in: body
        name: request
        required: true
        schema:
          properties:
            branch:
              type: string
            deploy_mode:
              type: string
            domain:
              type: string
            name:
              type: string
            repo_url:
              type: string
            server_id:
              type: string
            tech_stack:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: status, data (App object)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a new application
      tags:
      - Apps
  /apps/{id}:
    delete:
      description: Delete an application and its associated resources by ID
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status, data.message, data.id
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete an application
      tags:
      - Apps
    get:
      description: Retrieve details of a specific application by its ID
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status, data (App object)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: app not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get an application
      tags:
      - Apps
    put:
      consumes:
      - application/json
      description: Update fields of an existing application by ID
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: status, data (updated App object)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update an application
      tags:
      - Apps
  /apps/{id}/backup:
    post:
      description: Create a backup snapshot of an application
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status, data.backup_id, data.app_id
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Backup an application
      tags:
      - Apps
  /apps/{id}/backups:
    get:
      description: Retrieve backup records for an application
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status, data (array of DeploymentRecord)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List backups
      tags:
      - Backups
  /apps/{id}/backups/{backupId}:
    delete:
      description: Delete a backup record by ID
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      - description: Backup ID
        in: path
        name: backupId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status, data.message, data.backup_id
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a backup
      tags:
      - Backups
  /apps/{id}/build:
    post:
      consumes:
      - application/json
      description: Build an application from git source and deploy it. Supports optional
        overrides for branch, tech stack, ports, env vars, and server.
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      - description: Build and deploy overrides
        in: body
        name: request
        schema:
          properties:
            branch:
              type: string
            env_vars:
              additionalProperties:
                type: string
              type: object
            ports:
              type: string
            server_id:
              type: string
            tech_stack:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: status, data (BuildResult)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: app not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Build and deploy an application
      tags:
      - Apps
  /apps/{id}/deploy:
    post:
      consumes:
      - application/json
      description: Deploy an application using the provided deploy configuration.
        Set query param async=true for async deployment.
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      - default: "false"
        description: Set to 'true' for async deployment
        in: query
        name: async
        type: string
      - description: Deploy configuration
        in: body
        name: request
        schema:
          properties:
            app_name:
              type: string
            container_name:
              type: string
            env_vars:
              additionalProperties:
                type: string
              type: object
            image:
              type: string
            port:
              type: integer
            server_id:
              type: string
            volumes:
              items:
                type: string
              type: array
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: status, data (ContainerStatus)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request or preflight failure
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Deploy an application
      tags:
      - Apps
  /apps/{id}/env:
    get:
      description: Retrieve the environment variables configured for an application
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status, data.app_id, data.env_vars
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: app not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get application environment variables
      tags:
      - Apps
    put:
      consumes:
      - application/json
      description: Update the environment variables for an application
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      - description: Environment variables string
        in: body
        name: request
        required: true
        schema:
          properties:
            env_vars:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: status, data.app_id, data.message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update application environment variables
      tags:
      - Apps
  /apps/{id}/logs/container:
    get:
      description: Retrieve the most recent log lines from an application's container
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      - default: 100
        description: Number of log lines to retrieve
        in: query
        name: tail
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: status, data.container_name, data.tail, data.logs
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: app not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get container logs
      tags:
      - Apps
  /apps/{id}/restore:
    post:
      consumes:
      - application/json
      description: Restore an application to a previous backup state
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      - description: Restore request with backup ID
        in: body
        name: request
        required: true
        schema:
          properties:
            backup_id:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: status, data (ContainerStatus)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Restore an application from backup
      tags:
      - Apps
  /apps/{id}/rollback:
    post:
      consumes:
      - application/json
      description: Roll back an application container to a previous Docker image
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      - description: Rollback request with previous image
        in: body
        name: request
        required: true
        schema:
          properties:
            previous_image:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: status, data (ContainerStatus)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: app not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Rollback an application
      tags:
      - Apps
  /apps/{id}/status:
    get:
      description: Get the current deployment status of an application's container
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status, data (ContainerStatus)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: app not found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get application status
      tags:
      - Apps
  /audit-logs:
    get:
      description: Retrieve audit logs with pagination and optional filtering by user,
        action, or resource type
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size (1-100)
        in: query
        name: page_size
        type: integer
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: Filter by action type
        in: query
        name: action
        type: string
      - description: Filter by resource type
        in: query
        name: resource_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status, data.logs, data.total, data.page, data.page_size
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - Audit
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with username and password to obtain a JWT token
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          properties:
            password:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: status, data.user, data.token
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: invalid credentials
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      summary: Login
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with username, email, and password
      parameters:
      - description: Registration request
        in: body
        name: request
        required: true
        schema:
          properties:
            email:
              type: string
            password:
              type: string
            username:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: status, data.user, data.token
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: username or email already exists
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      summary: Register a new user
      tags:
      - Auth
  /cicd/status/{runID}:
    get:
      description: Retrieve the status of a specific CI/CD build run
      parameters:
      - description: CI provider name
        in: query
        name: provider
        required: true
        type: string
      - description: CI build run ID
        in: path
        name: runID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status, data (build status)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get CI/CD build status
      tags:
      - CI/CD
  /cicd/trigger:
    post:
      consumes:
      - application/json
      description: Trigger a new CI/CD build for a repository on a specific branch
      parameters:
      - description: CI build trigger request
        in: body
        name: request
        required: true
        schema:
          properties:
            branch:
              type: string
            provider:
              type: string
            repo:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: status, data (build result)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Trigger a CI/CD build
      tags:
      - CI/CD
  /credentials:
    get:
      description: Retrieve all encrypted credentials for a tenant
      parameters:
      - default: '"tenant-default"'
        description: Tenant ID
        in: query
        name: tenant_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status, data (array of Credential)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List credentials
      tags:
      - Credentials
    post:
      consumes:
      - application/json
      description: Create a new encrypted credential entry
      parameters:
      - description: Credential creation request
        in: body
        name: request
        required: true
        schema:
          properties:
            name:
              type: string
            tenant_id:
              type: string
            type:
              type: string
            value:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: status, data (Credential)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create a credential
      tags:
      - Credentials
  /credentials/{id}:
    delete:
      description: Delete a credential by ID
      parameters:
      - description: Credential ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status, data.message, data.id
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete a credential
      tags:
      - Credentials
    put:
      consumes:
      - application/json
      description: Update the value of an existing credential
      parameters:
      - description: Credential ID
        in: path
        name: id
        required: true
        type: string
      - description: New credential value
        in: body
        name: request
        required: true
        schema:
          properties:
            value:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: status, data (updated Credential)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update a credential
      tags:
      - Credentials
  /deployments:
    get:
      description: Retrieve deployment records with optional filtering by app_id and
        status
      parameters:
      - description: Filter by application ID
        in: query
        name: app_id
        type: string
      - description: Filter by deployment status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status, data (array of DeploymentRecord)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List deployments
      tags:
      - Deployments
  /deployments/{id}:
    get:
      description: Retrieve a single deployment record by ID
      parameters:
      - description: Deployment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status, data (DeploymentRecord)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: deployment not found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get a deployment
      tags:
      - Deployments
  /dns/records:
    get:
      description: Retrieve all DNS records for a given domain
      parameters:
      - description: Domain name
        in: query
        name: domain
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: status, data (array of DNS records)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: domain query parameter is required
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List DNS records
      tags:
      - DNS
    post:
      consumes:
      - application/json
      description: Create a new DNS record for a domain
      parameters:
      - description: DNS record creation request
        in: body
        name: request
        required: true
        schema:
          properties:
            domain:
              type: string
            name:
              type: string
            type:
              type: string
            value:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: status, data (DNS record)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: internal error
          schema:
