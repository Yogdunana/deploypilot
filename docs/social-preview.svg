<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#207BEC"/>
      <stop offset="100%" style="stop-color:#1B7BF4"/>
    </linearGradient>
    <linearGradient id="glow-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1B7BF4;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#1B7BF4;stop-opacity:0"/>
    </linearGradient>
    <pattern id="dot-pattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#334155" opacity="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg-gradient)"/>

  <!-- Dot pattern overlay -->
  <rect width="1280" height="640" fill="url(#dot-pattern)"/>

  <!-- Subtle top-right glow -->
  <ellipse cx="1100" cy="120" rx="350" ry="250" fill="url(#glow-gradient)"/>

  <!-- Subtle bottom-left glow -->
  <ellipse cx="180" cy="520" rx="300" ry="200" fill="#207BEC" opacity="0.04"/>

  <!-- Decorative accent line -->
  <rect x="100" y="280" width="80" height="4" rx="2" fill="url(#accent-gradient)" filter="url(#glow)"/>

  <!-- Project icon (simplified rocket/gateway shape inspired by logo) -->
  <g transform="translate(100, 140)" filter="url(#soft-shadow)">
    <!-- Rocket body -->
    <path d="M40,120 C40,120 20,80 20,40 C20,10 40,0 40,0 C40,0 60,10 60,40 C60,80 40,120 40,120Z" fill="#207BEC"/>
    <!-- Rocket window -->
    <circle cx="40" cy="45" r="8" fill="#0f172a" stroke="#1B7BF4" stroke-width="1.5"/>
    <!-- Rocket fins -->
    <path d="M20,100 L8,125 L28,110Z" fill="#1B7BF4"/>
    <path d="M60,100 L72,125 L52,110Z" fill="#1B7BF4"/>
    <!-- Flame -->
    <path d="M35,120 L40,145 L45,120Z" fill="#F75646" opacity="0.9"/>
    <path d="M37,120 L40,138 L43,120Z" fill="#FEFEFC" opacity="0.6"/>
    <!-- Deployment arrows -->
    <path d="M75,50 L90,35 M75,50 L90,50 M75,50 L90,65" stroke="#1B7BF4" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M5,50 L-10,35 M5,50 L-10,50 M5,50 L-10,65" stroke="#1B7BF4" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Project name -->
  <text x="100" y="380" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#FEFEFC" letter-spacing="-1">
    Deploy<tspan fill="#1B7BF4">Pilot</tspan>
  </text>

  <!-- Tagline -->
  <text x="102" y="425" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" fill="#94a3b8" letter-spacing="0.5">
    The AI-native deployment gateway
  </text>

  <!-- Feature badges -->
  <g transform="translate(100, 470)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#22c55e"/>
    <text x="30" y="21" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Docker</text>

    <!-- Badge 2 -->
    <rect x="155" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="173" cy="16" r="4" fill="#1B7BF4"/>
    <text x="185" y="21" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">Kubernetes</text>

    <!-- Badge 3 -->
    <rect x="310" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="328" cy="16" r="4" fill="#F75646"/>
    <text x="340" y="21" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">CI/CD</text>

    <!-- Badge 4 -->
    <rect x="465" y="0" width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="483" cy="16" r="4" fill="#a855f7"/>
    <text x="495" y="21" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#cbd5e1">MCP</text>
  </g>

  <!-- Right side decorative elements -->
  <g transform="translate(850, 100)" opacity="0.12">
    <!-- Grid lines -->
    <line x1="0" y1="0" x2="0" y2="440" stroke="#1B7BF4" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="440" stroke="#1B7BF4" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="440" stroke="#1B7BF4" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="440" stroke="#1B7BF4" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="440" stroke="#1B7BF4" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="440" stroke="#1B7BF4" stroke-width="1"/>
    <line x1="0" y1="0" x2="300" y2="0" stroke="#1B7BF4" stroke-width="1"/>
    <line x1="0" y1="60" x2="300" y2="60" stroke="#1B7BF4" stroke-width="1"/>
    <line x1="0" y1="120" x2="300" y2="120" stroke="#1B7BF4" stroke-width="1"/>
    <line x1="0" y1="180" x2="300" y2="180" stroke="#1B7BF4" stroke-width="1"/>
    <line x1="0" y1="240" x2="300" y2="240" stroke="#1B7BF4" stroke-width="1"/>
    <line x1="0" y1="300" x2="300" y2="300" stroke="#1B7BF4" stroke-width="1"/>
    <line x1="0" y1="360" x2="300" y2="360" stroke="#1B7BF4" stroke-width="1"/>
    <line x1="0" y1="440" x2="300" y2="440" stroke="#1B7BF4" stroke-width="1"/>
  </g>

  <!-- Right side floating nodes (representing deployment targets) -->
  <g transform="translate(920, 180)">
    <!-- Central node -->
    <circle cx="120" cy="140" r="24" fill="#1e293b" stroke="#1B7BF4" stroke-width="2" filter="url(#soft-shadow)"/>
    <circle cx="120" cy="140" r="8" fill="#1B7BF4"/>

    <!-- Connected nodes -->
    <circle cx="40" cy="60" r="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="40" cy="60" r="5" fill="#22c55e"/>
    <line x1="52" y1="70" x2="102" y2="126" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

    <circle cx="200" cy="60" r="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="200" cy="60" r="5" fill="#22c55e"/>
    <line x1="188" y1="70" x2="138" y2="126" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

    <circle cx="40" cy="220" r="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="40" cy="220" r="5" fill="#F75646"/>
    <line x1="52" y1="210" x2="102" y2="154" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

    <circle cx="200" cy="220" r="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="200" cy="220" r="5" fill="#22c55e"/>
    <line x1="188" y1="210" x2="138" y2="154" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

    <circle cx="120" cy="280" r="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="120" cy="280" r="5" fill="#22c55e"/>
    <line x1="120" y1="264" x2="120" y2="164" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="636" width="1280" height="4" fill="url(#accent-gradient)" opacity="0.6"/>

  <!-- GitHub URL hint -->
  <text x="1180" y="610" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" fill="#475569" text-anchor="end">
    github.com/Yogdunana/DeployPilot
  </text>
</svg>
