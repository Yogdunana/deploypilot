name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag ref (e.g. refs/tags/v1.0.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Verify annotated tag
        if: github.event_name == 'push'
        run: |
          TAG_TYPE=$(git cat-file -t ${{ github.ref_name }})
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "::error::Tag ${{ github.ref_name }} is a lightweight tag ($TAG_TYPE). Only annotated tags are allowed."
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.13"

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-${{ matrix.goarch }}-

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm modules
        uses: actions/cache@v5
        with:
          path: web/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Ensure go.sum is up to date
        run: go mod tidy

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cross-compiler for arm64
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
          VERSION: ${{ github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
          BUILD_TIME: ''
        run: |
          BUILD_TIME="${BUILD_TIME:-$(date -u '+%Y-%m-%dT%H:%M:%SZ')}"
          mkdir -p dist
          LDFLAGS="-s -w \
            -X github.com/Yogdunana/deploypilot/internal/version.Version=${VERSION} \
            -X github.com/Yogdunana/deploypilot/internal/version.GitCommit=${GIT_COMMIT:0:8} \
            -X github.com/Yogdunana/deploypilot/internal/version.BuildTime=${BUILD_TIME}"
          for cmd in deploypilot api-server mcp-server; do
            go build -ldflags="${LDFLAGS}" -o dist/${cmd}-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/${cmd}/
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  create-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum * > checksums-sha256.txt

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" HEAD)
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changes }}

            ## Assets

            ### Linux amd64
            - `deploypilot-linux-amd64` — CLI tool
            - `api-server-linux-amd64` — REST API + Web Dashboard
            - `mcp-server-linux-amd64` — MCP Server

            ### Linux arm64
            - `deploypilot-linux-arm64` — CLI tool
            - `api-server-linux-arm64` — REST API + Web Dashboard
            - `mcp-server-linux-arm64` — MCP Server

            ## Docker

            ```bash
            docker pull ghcr.io/yogdunana/deploypilot:${{ github.ref_name }}
            ```
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}

  sync-gitee:
    name: Sync Release to Gitee
    needs: [build-binaries, create-release]
    if: always() && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Delete old Gitee releases
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          releases=$(curl -s -H "Authorization: token ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/Yogdunana/deploypilot/releases" | jq -r '.[].id')
          for release_id in $releases; do
            echo "Deleting Gitee release $release_id"
            curl -s -X DELETE -H "Authorization: token ${GITEE_TOKEN}" \
              "https://gitee.com/api/v5/repos/Yogdunana/deploypilot/releases/$release_id"
          done

      - name: Create Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          
          # Create release
          echo "Creating Gitee release for tag $TAG"
          release_response=$(curl -s -X POST \
            -H "Authorization: token ${GITEE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"$TAG\", \"name\": \"$TAG\", \"body\": \"Release $TAG\", \"target_commitish\": \"main\"}" \
            "https://gitee.com/api/v5/repos/Yogdunana/deploypilot/releases")
          
          release_id=$(echo "$release_response" | jq -r '.id')
          if [ "$release_id" = "null" ] || [ -z "$release_id" ]; then
            echo "Failed to create release: $release_response"
            exit 1
          fi
          echo "Created release ID: $release_id"
          
          # Upload assets with retry
          for file in dist/*; do
            filename=$(basename "$file")
            echo "Uploading $filename..."
            
            for attempt in 1 2 3; do
              response=$(curl -s -X POST \
                -H "Authorization: token ${GITEE_TOKEN}" \
                -F "file=@$file" \
                "https://gitee.com/api/v5/repos/Yogdunana/deploypilot/releases/$release_id/attach_files")
              
              if echo "$response" | jq -e '.id' > /dev/null 2>&1; then
                echo "  ✓ $filename uploaded successfully"
                break
              else
                echo "  ✗ Attempt $attempt failed: $response"
                if [ $attempt -eq 3 ]; then
                  echo "  Failed to upload $filename after 3 attempts"
                else
                  sleep 30
                fi
              fi
            done
          done
          
          echo "Gitee release sync completed"
