name: Sync Wiki
on:
  push:
    branches: [main]
    paths: ['docs/wiki/**', '.github/workflows/wiki-sync.yml']
  workflow_dispatch:

concurrency:
  group: wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sync docs/wiki to GitHub Wiki
        uses: spenserblack/actions-wiki@v0.3.0
        with:
          path: docs/wiki
