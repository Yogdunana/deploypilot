name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Deploy DeployPilot with...
        2. Configure...
        3. Run...
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste relevant logs or error messages.
      render: shell

  - type: input
    id: version
    attributes:
      label: DeployPilot Version
      description: Output of `deploypilot version` or the version tag.
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, deployment method.
      placeholder: "Ubuntu 22.04 / amd64 / Docker"

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - MCP Server
        - API Server
        - Web Dashboard
        - CLI Tool
        - Docker Deployment
        - Install Script
        - Other
    validations:
      required: true
